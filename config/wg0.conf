# Шаблон конфигурации AmneziaWG.
# Замените значения на свои перед первым запуском (chmod 600 рекомендуется).
#
# Параметры Jc/Jmin/Jmax/S1/S2/H1-H4 - это специфичные для AmneziaWG
# параметры обфускации протокола (см. https://github.com/amnezia-vpn/amneziawg-tools)

[Interface]
PrivateKey = REPLACE_ME_PRIVATE_KEY
Address = 10.8.1.2/32
DNS = 1.1.1.1, 1.0.0.1
MTU = 1380

# AmneziaWG obfuscation параметры (пример значений, синхронизируйте с сервером)
Jc = 4
Jmin = 40
Jmax = 70
S1 = 0
S2 = 0
H1 = 1
H2 = 2
H3 = 3
H4 = 4

[Peer]
PublicKey = REPLACE_ME_SERVER_PUBLIC_KEY
Endpoint = REPLACE_ME_SERVER_IP:51820
AllowedIPs = 0.0.0.0/0, ::/0
PersistentKeepalive = 25
